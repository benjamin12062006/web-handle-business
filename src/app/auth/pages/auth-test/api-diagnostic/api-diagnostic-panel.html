<section class="group" aria-labelledby="diagnostic-title">
  <div class="flex items-center justify-between pb-2 border-b border-slate-800/60 mb-4">
    <div class="flex flex-col">
      <h2 id="diagnostic-title" class="text-sm font-medium text-slate-300 uppercase tracking-wide">
        Diagnóstico API
      </h2>
      <span class="text-[10px] font-mono text-slate-500 mt-1"
        >{{ apiBaseUrl() || 'API URL no configurada' }}</span
      >
    </div>
    <button
      type="button"
      (click)="withoutTokenRequested.emit()"
      [disabled]="!!pending()"
      class="inline-flex items-center text-xs font-medium text-slate-400 hover:text-white transition-colors disabled:opacity-50"
      title="Consultar sin Bearer Token"
    >
      <svg class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M13 10V3L4 14h7v7l9-11h-7z"
        />
      </svg>
      {{ pending() === 'without-token' ? '...' : 'Test 401' }}
    </button>
  </div>

  <div class="mt-2" aria-live="polite" aria-atomic="true">
    @if (notice()) {
    <div class="flex items-start gap-3 rounded-lg border border-amber-500/20 bg-amber-500/10 p-3">
      <svg
        class="h-5 w-5 text-amber-500 shrink-0 mt-0.5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
        />
      </svg>
      <p class="text-xs text-amber-200/90 leading-relaxed">{{ notice() }}</p>
    </div>
    } @if (diagnostic(); as result) {
    <div class="rounded-lg bg-slate-800/40 p-4 border border-slate-700/30 font-mono">
      <div class="flex items-center gap-2 mb-2">
        <span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-slate-700 text-slate-300"
          >{{ result.method }}</span
        >
        <span class="text-xs text-slate-400 truncate">{{ result.endpoint }}</span>
        <span
          class="ml-auto text-[10px] font-bold px-2 py-0.5 rounded-full"
          [class.bg-emerald-500/20]="result.status !== null && result.status >= 200 && result.status < 300"
          [class.text-emerald-400]="result.status !== null && result.status >= 200 && result.status < 300"
          [class.bg-amber-500/20]="result.status === 401 || result.status === 403"
          [class.text-amber-400]="result.status === 401 || result.status === 403"
          [class.bg-red-500/20]="result.status !== null && (result.status >= 500 || result.status === 404 || result.status === 400)"
          [class.text-red-400]="result.status !== null && (result.status >= 500 || result.status === 404 || result.status === 400)"
          [class.bg-slate-700]="result.status === null"
          [class.text-slate-300]="result.status === null"
        >
          {{ result.status || 'ERROR' }}
        </span>
      </div>
      <p class="text-xs text-slate-300 whitespace-pre-wrap break-words leading-relaxed">
        {{ result.message }}
      </p>
    </div>
    } @else if (!notice()) {
    <p class="text-xs text-slate-500 italic text-center py-2">
      La respuesta del servidor aparecerá aquí.
    </p>
    }
  </div>
</section>
