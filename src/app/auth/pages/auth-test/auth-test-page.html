<main class="min-h-screen grid lg:grid-cols-2 bg-slate-950 text-slate-100">
  <!-- Left Side: Content -->
  <div
    class="flex flex-col justify-center items-center px-6 py-12 sm:px-12 lg:px-20 lg:items-start lg:justify-center overflow-y-auto"
  >
    <div class="w-full max-w-md">
      <header class="mb-12 text-center lg:text-left">
        <p class="mb-2 text-xs font-bold uppercase tracking-widest text-emerald-400">
          Navigate Business
        </p>
        <h1 class="text-3xl sm:text-4xl font-semibold tracking-tight text-white mb-3">
          Prueba de Autenticación
        </h1>
        <p class="text-sm leading-relaxed text-slate-400">
          Inicia sesión con Google y comprueba tu cuenta en la API.
        </p>
      </header>

      <div class="space-y-8">
        <app-firebase-session-card
          [state]="state.session.state()"
          [user]="state.session.user()"
          [pending]="state.pending()"
          [configurationMissing]="!!config.missing.length"
          (loginRequested)="state.login()"
          (logoutRequested)="state.logout()"
        />

        <app-application-account-card
          [sessionState]="state.session.state()"
          [account]="state.account()"
          [pending]="state.pending()"
          (syncRequested)="state.sync()"
          (currentRequested)="state.current()"
        />

        <app-api-diagnostic-panel
          [apiBaseUrl]="config.apiBaseUrl"
          [pending]="state.pending()"
          [notice]="state.notice()"
          [diagnostic]="state.diagnostic()"
          (withoutTokenRequested)="state.withoutToken()"
        />
      </div>
    </div>
  </div>

  <!-- Right Side: Minimalist Abstract Background -->
  <div class="hidden lg:block relative w-full h-full bg-slate-900 overflow-hidden">
    <div
      class="absolute inset-0 bg-gradient-to-br from-teal-500/20 via-emerald-900/40 to-slate-950 z-10"
    ></div>
    <img
      src="https://images.unsplash.com/photo-1557682250-33bd709cbe85?q=80&w=2529&auto=format&fit=crop"
      alt="Abstract Background"
      class="absolute inset-0 h-full w-full object-cover opacity-50 mix-blend-luminosity"
    />
  </div>
</main>
