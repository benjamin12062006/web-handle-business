<section class="group" aria-labelledby="account-title">
  <div class="flex items-center justify-between pb-2 border-b border-slate-800/60 mb-4">
    <h2 id="account-title" class="text-sm font-medium text-slate-300 uppercase tracking-wide">
      2. Cuenta API
    </h2>
  </div>

  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap gap-2">
      <button
        type="button"
        (click)="syncRequested.emit()"
        [disabled]="!!pending() || sessionState() !== 'signed-in'"
        class="flex-1 min-w-[140px] inline-flex justify-center items-center rounded-md bg-emerald-500 hover:bg-emerald-400 px-4 py-2.5 text-sm font-semibold text-slate-950 transition-all focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 focus:ring-offset-slate-950 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm shadow-emerald-500/20"
      >
        {{ pending() === 'sync' ? 'Sincronizando...' : 'Sincronizar' }}
      </button>
      <button
        type="button"
        (click)="currentRequested.emit()"
        [disabled]="!!pending() || sessionState() !== 'signed-in'"
        class="flex-1 min-w-[140px] inline-flex justify-center items-center rounded-md bg-slate-800/80 hover:bg-slate-700 px-4 py-2.5 text-sm font-medium text-white transition-all focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2 focus:ring-offset-slate-950 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ pending() === 'me' ? 'Consultando...' : 'Consultar' }}
      </button>
    </div>

    @if (account(); as account) {
    <div class="mt-2 rounded-lg bg-slate-800/30 p-4 border border-slate-700/50 backdrop-blur-sm">
      <dl class="space-y-3">
        <div>
          <dt class="text-[10px] font-semibold tracking-wider text-slate-500 uppercase">
            ID de Cuenta
          </dt>
          <dd class="mt-0.5 font-mono text-xs text-emerald-400 break-all">
            {{ account.account_id }}
          </dd>
        </div>
        <div>
          <dt class="text-[10px] font-semibold tracking-wider text-slate-500 uppercase">
            Creada en
          </dt>
          <dd class="mt-0.5 font-mono text-xs text-slate-300">{{ account.created_at }}</dd>
        </div>
      </dl>
    </div>
    } @else {
    <p class="text-xs text-slate-500 mt-1 leading-relaxed">
      Debes sincronizar tu identidad para crear o actualizar la cuenta en nuestra base de datos.
    </p>
    }
  </div>
</section>
