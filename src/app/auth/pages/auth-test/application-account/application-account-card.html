<section
  class="h-full rounded-2xl border border-slate-800 bg-slate-900 p-6"
  aria-labelledby="account-title"
>
  <h2 id="account-title" class="text-lg font-semibold">2. Cuenta de la aplicación</h2>
  <p class="mt-4 text-sm leading-relaxed text-slate-400">
    Sincroniza tu identidad y luego consulta la cuenta. Consultar antes de sincronizar permite
    comprobar el caso de cuenta inexistente.
  </p>
  <div class="mt-5 flex flex-wrap gap-3">
    <button
      type="button"
      (click)="syncRequested.emit()"
      [disabled]="!!pending() || sessionState() !== 'signed-in'"
      class="rounded-lg bg-slate-100 px-4 py-2.5 text-sm font-semibold text-slate-950 hover:bg-white disabled:cursor-not-allowed disabled:opacity-40"
    >
      {{ pending() === 'sync' ? 'Sincronizando…' : 'Sincronizar cuenta' }}
    </button>
    <button
      type="button"
      (click)="currentRequested.emit()"
      [disabled]="!!pending() || sessionState() !== 'signed-in'"
      class="rounded-lg border border-slate-600 px-4 py-2.5 text-sm font-medium hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-40"
    >
      {{ pending() === 'me' ? 'Consultando…' : 'Consultar mi cuenta' }}
    </button>
  </div>
  @if (account(); as account) {
    <dl class="mt-6 space-y-3 border-t border-slate-800 pt-5 text-sm">
      <div>
        <dt class="text-slate-400">Identificador de cuenta</dt>
        <dd class="mt-1 break-all font-mono text-xs text-emerald-300">
          {{ account.account_id }}
        </dd>
      </div>
      <div>
        <dt class="text-slate-400">Creada</dt>
        <dd class="mt-1 break-all font-mono text-xs">{{ account.created_at }}</dd>
      </div>
    </dl>
  }
</section>
